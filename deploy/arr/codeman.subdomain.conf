## codeman.siumimi.com -> codeman:3000 (LAN + WireGuard only)
# Installed with ~/.claude/skills/swag-deploy/bin/swag-apply on arr.
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name codeman.*;

    include /config/nginx/ssl.conf;
    include /config/nginx/snippets/cf_real-ip-trusted.conf;

    # Pasted images and file attachments.
    client_max_body_size 100m;

    location / {
        include /config/nginx/snippets/local-only.conf;

        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app codeman;
        set $upstream_port 3000;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;

        # Terminal output and status arrive over SSE and WebSockets: no buffering,
        # and keep idle streams open.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }
}
