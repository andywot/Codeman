## codeman.siumimi.com -> codeman:3000 (LAN + WireGuard only, tinyauth admins group)
# Installed with ~/.claude/skills/swag-deploy/bin/swag-apply on arr.
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name codeman.*;

    include /config/nginx/ssl.conf;
    include /config/nginx/snippets/cf_real-ip-trusted.conf;

    # Pasted images and file attachments.
    client_max_body_size 100m;

    include /config/nginx/tinyauth-server.conf;

    location / {
        include /config/nginx/snippets/local-only.conf;
        include /config/nginx/tinyauth-location.conf;

        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        # Codeman's Basic credentials, added after tinyauth lets you in (0600, not in git).
        include /config/nginx/snippets/codeman-auth.conf;
        set $upstream_app codeman;
        set $upstream_port 3000;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;

        # Terminal output and status arrive over SSE and WebSockets: no buffering.
        # proxy.conf's 240 s timeouts are enough (SSE heartbeat 15 s, WS ping 30 s).
        proxy_buffering off;
        proxy_cache off;
    }
}
