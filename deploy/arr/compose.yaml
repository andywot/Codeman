# Codeman on arr (192.168.0.50), behind SWAG at https://codeman.siumimi.com (LAN + WireGuard only).
#
# Differs from docker/docker-compose.yaml on purpose:
#  - no published ports: SWAG reaches it as http://codeman:3000 over swag-network
#  - no Docker socket and no cases path: "Docker cases" are not used, and the socket
#    would give the web UI root-equivalent control of the host
#  - no repo bind mount: runs the code baked into the image; self-update is disabled,
#    updates are `git pull && docker compose up -d --build` in /srv/codeman
#
# Run from this directory: docker compose up -d --build
name: codeman
services:
  codeman:
    build:
      context: ../..
      dockerfile: docker/server.Dockerfile
      args:
        CODEMAN_RUNTIME_USER: codeman
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
    image: codeman:local
    container_name: codeman
    init: true
    restart: unless-stopped
    environment:
      CODEMAN_IN_CONTAINER: "1"
      CODEMAN_RESTART_BY_EXIT: "1"
      CODEMAN_DISABLE_SELF_UPDATE: "1"
      CODEMAN_HOST: 0.0.0.0
      CODEMAN_PORT: "3000"
      CODEMAN_ALLOWED_HOSTS: codeman.siumimi.com
      CODEMAN_USERNAME: ${CODEMAN_USERNAME:-andy}
      CODEMAN_PASSWORD: ${CODEMAN_PASSWORD:?set CODEMAN_PASSWORD in .env}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: Asia/Hong_Kong
    volumes:
      # Codeman state, CLI logins and the SSH key used to reach the PCs.
      - type: bind
        source: /docker/appdata/codeman
        target: /home/codeman
    networks:
      - swag-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - KILL
      - SETGID
      - SETUID
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/api/status').then((r) => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  swag-network:
    external: true
